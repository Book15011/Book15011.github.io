<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thanisorn J. — Quant Developer &amp; Robotics Engineer</title>
<meta name="description" content="Portfolio of Thanisorn J., a Mechanical &amp; Automation Engineering student bridging algorithmic trading with robotics. Choose a track: Quantitative Developer or Robotics Engineer.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Inter:wght@300;400;500;600;700;800&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --q-bg:#05070c;
    --q-bg2:#0b1220;
    --q-text:#eef1f6;
    --q-muted:#9aa3b5;
    --q-accent:#3ecf8e;

    --r-bg:#0f0c29;
    --r-bg2:#302b63;
    --r-bg3:#24243e;
    --r-accent:#00eeff;

    --ink:#04050a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ min-height:100%; }

  body{
    background:var(--ink);
    color:#fff;
    font-family:'Inter', 'Segoe UI', sans-serif;
    overflow-x:hidden;
  }

  .skip-link{
    position:absolute;
    left:-999px; top:0;
    background:#000; color:#fff;
    padding:10px 16px;
    z-index:100;
    font-size:0.85rem;
  }
  .skip-link:focus{ left:12px; top:12px; }

  .gateway{
    display:flex;
    min-height:100vh;
    width:100%;
  }

  /* ---------------- Panels ---------------- */
  .panel{
    position:relative;
    flex:1 1 0;
    min-width:0;
    min-height:0;
    display:flex;
    align-items:center;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    isolation:isolate;
  }

  .panel-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }

  .panel-content{
    position:relative;
    z-index:2;
    padding:0 clamp(28px, 6vw, 90px);
    max-width:560px;
  }

  .panel-eyebrow{
    font-family:'Roboto Mono', monospace;
    font-size:0.72rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:16px;
    opacity:0.85;
  }

  .panel-title{
    font-size:clamp(2.1rem, 4.4vw, 3.7rem);
    line-height:1.08;
    letter-spacing:0.4px;
  }

  .panel-subtitle{
    font-size:clamp(0.95rem, 1.4vw, 1.1rem);
    margin-top:16px;
    max-width:320px;
    line-height:1.55;
  }

  .panel-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:30px;
    font-family:'Roboto Mono', monospace;
    font-size:0.78rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-weight:500;
  }
  .panel-cta svg{ width:16px; height:16px; transition:transform 0.3s ease; }
  .panel:hover .panel-cta svg{ transform:translateX(5px); }

  .panel-subtitle, .panel-cta{ opacity:1; transform:none; }

  .panel:focus-visible{ outline:none; }

  /* Quant panel identity */
  .panel--quant{
    background:
      radial-gradient(60% 60% at 12% 50%, rgba(4,6,10,0.8), transparent 70%),
      radial-gradient(130% 150% at 10% 15%, var(--q-bg2) 0%, var(--q-bg) 62%, var(--q-bg) 100%);
  }
  .panel--quant .panel-eyebrow{ color:var(--q-accent); }
  .panel--quant .panel-title{ font-family:'Playfair Display', serif; font-weight:700; color:var(--q-text); }
  .panel--quant .panel-subtitle{ font-family:'Inter', sans-serif; color:var(--q-muted); }
  .panel--quant .panel-cta{ color:var(--q-accent); }
  .panel--quant:focus-visible{ box-shadow: inset 0 0 0 2px rgba(62,207,142,0.75); }

  /* Robotics panel identity */
  .panel--robotics{
    background:
      radial-gradient(60% 60% at 88% 50%, rgba(4,6,10,0.75), transparent 70%),
      radial-gradient(130% 150% at 90% 15%, var(--r-bg2) 0%, var(--r-bg3) 55%, var(--r-bg) 100%);
  }
  .panel--robotics .panel-eyebrow{ color:var(--r-accent); }
  .panel--robotics .panel-title{
    font-family:'Inter', sans-serif;
    font-weight:800;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 26px rgba(0,238,255,0.35);
  }
  .panel--robotics .panel-subtitle{ font-family:'Inter', sans-serif; color:rgba(255,255,255,0.68); }
  .panel--robotics .panel-cta{ color:var(--r-accent); }
  .panel--robotics:focus-visible{ box-shadow: inset 0 0 0 2px rgba(0,238,255,0.75); }

  /* cyberpunk scanline, robotics only */
  .panel--robotics::before{
    content:'';
    position:absolute;
    left:0; right:0;
    height:160px;
    background:linear-gradient(180deg, transparent, rgba(0,238,255,0.09), transparent);
    animation:scan 7s linear infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes scan{
    0%{ transform:translateY(-180px); }
    100%{ transform:translateY(110vh); }
  }

  /* Hover / focus reveal — desktop pointer devices only */
  @media (hover:hover) and (pointer:fine){
    .panel-subtitle, .panel-cta{
      opacity:0;
      transform:translateY(10px);
      transition:opacity 0.5s ease, transform 0.5s ease;
    }
    .panel-title{ transition:transform 0.6s ease; display:inline-block; }
    .panel:hover .panel-title, .panel:focus-visible .panel-title{ transform:scale(1.03); }
    .panel:hover .panel-subtitle, .panel:focus-visible .panel-subtitle,
    .panel:hover .panel-cta, .panel:focus-visible .panel-cta{
      opacity:1;
      transform:translateY(0);
    }
  }

  /* ---------------- Divider ---------------- */
  .divider{
    flex:0 0 auto;
    width:clamp(56px, 8vw, 110px);
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    position:relative;
    z-index:3;
    padding:24px 0;
    border-left:1px solid rgba(255,255,255,0.07);
    border-right:1px solid rgba(255,255,255,0.07);
  }
  .divider-line{
    width:1px;
    flex:1;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
  }
  .divider-badge{
    flex-shrink:0;
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif;
    font-size:1rem;
    letter-spacing:1px;
    color:#fff;
  }

  /* ---------------- Masthead ---------------- */
  .masthead{
    position:absolute;
    top:28px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    text-align:center;
    pointer-events:none;
    background:rgba(4,5,10,0.45);
    backdrop-filter:blur(6px);
    padding:10px 26px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .masthead-name{
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    font-weight:500;
    letter-spacing:3px;
    color:rgba(255,255,255,0.9);
  }
  .masthead-tagline{
    font-family:'Roboto Mono', monospace;
    font-size:0.66rem;
    letter-spacing:1.5px;
    color:rgba(255,255,255,0.45);
    margin-top:5px;
  }

  /* ---------------- Mobile ---------------- */
  @media (max-width:768px){
    .gateway{ flex-direction:column; }

    .divider{
      flex-direction:row;
      width:100%;
      height:56px;
      padding:0 24px;
      border-left:none; border-right:none;
      border-top:1px solid rgba(255,255,255,0.07);
      border-bottom:1px solid rgba(255,255,255,0.07);
    }
    .divider-line{ width:auto; height:1px; flex:1; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); }
    .divider-badge{ width:36px; height:36px; font-size:0.8rem; }

    .panel{ min-height:0; }
    .panel-content{ padding:0 28px; max-width:100%; }
    .panel-title{ font-size:clamp(2rem, 8vw, 2.6rem); }

    .masthead{ top:14px; padding:8px 18px; }
    .masthead-name{ font-size:0.7rem; letter-spacing:2px; }
    .masthead-tagline{ font-size:0.58rem; }
  }

  @media (max-width:400px){
    .panel-content{ padding:0 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .panel--robotics::before{ animation:none; opacity:0.5; }
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#gateway">Skip to content</a>

<div class="masthead" aria-hidden="true">
  <div class="masthead-name">THANISORN&nbsp;J.</div>
  <div class="masthead-tagline">TWO DISCIPLINES · ONE BUILDER</div>
</div>

<main class="gateway" id="gateway">

  <a href="quant.html" class="panel panel--quant" id="panel-quant" aria-label="Quantitative Developer track — Algorithmic Trading and Data Science">
    <canvas class="panel-canvas" id="canvas-quant" aria-hidden="true"></canvas>
    <div class="panel-content">
      <p class="panel-eyebrow">Track&nbsp;01</p>
      <h2 class="panel-title">Quantitative<br>Developer</h2>
      <p class="panel-subtitle">Algorithmic Trading &amp; Data Science</p>
      <span class="panel-cta">Enter
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </div>
  </a>

  <div class="divider" aria-hidden="true">
    <span class="divider-line"></span>
    <span class="divider-badge">TJ</span>
    <span class="divider-line"></span>
  </div>

  <a href="robotics.html" class="panel panel--robotics" id="panel-robotics" aria-label="Robotics Engineer track — Hardware Prototyping and System Integration">
    <canvas class="panel-canvas" id="canvas-robotics" aria-hidden="true"></canvas>
    <div class="panel-content">
      <p class="panel-eyebrow">Track&nbsp;02</p>
      <h2 class="panel-title">Robotics<br>Engineer</h2>
      <p class="panel-subtitle">Hardware Prototyping &amp; System Integration</p>
      <span class="panel-cta">Enter
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </div>
  </a>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Canvas field engine (shared by both panels) ---------- */
  function createFieldCanvas(canvas, cfg) {
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, dpr = 1;
    let nodes = [];
    let ticks = [];
    let intensity = 0;
    let targetIntensity = 0;
    let rafId = null;
    let last = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(rect.width, 1);
      height = Math.max(rect.height, 1);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initNodes();
      if (cfg.ticker) initTicker();
    }

    function initNodes() {
      const count = cfg.nodeCount || Math.max(14, Math.round((width * height) / 26000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        r: Math.random() * 1.4 + 0.7
      }));
    }

    function initTicker() {
      const lineCount = cfg.tickerLines || 3;
      const pointCount = 42;
      ticks = Array.from({ length: lineCount }, (_, li) => {
        const base = height * (0.22 + li * 0.24) + (Math.random() - 0.5) * 24;
        const pts = [];
        let val = base;
        for (let i = 0; i < pointCount; i++) {
          val += (Math.random() - 0.5) * 9;
          val = base + (val - base) * 0.65;
          pts.push(val);
        }
        return { base, pts, acc: 0 };
      });
    }

    function stepTicker(dt) {
      const stepTime = 110;
      ticks.forEach((line) => {
        line.acc += dt;
        while (line.acc > stepTime) {
          line.acc -= stepTime;
          line.pts.shift();
          const lastVal = line.pts[line.pts.length - 1];
          let next = lastVal + (Math.random() - 0.5) * 12;
          next = line.base + (next - line.base) * 0.7;
          line.pts.push(next);
        }
      });
    }

    function drawGrid() {
      const gap = 46;
      ctx.strokeStyle = cfg.gridColor;
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gap) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawTicker() {
      if (!ticks.length) return;
      const segW = width / (ticks[0].pts.length - 1);
      ticks.forEach((line, li) => {
        ctx.beginPath();
        line.pts.forEach((y, i) => {
          const x = i * segW;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = cfg.tickerColor(li, intensity);
        ctx.lineWidth = 1.3;
        ctx.shadowColor = cfg.glow;
        ctx.shadowBlur = 5 + intensity * 9;
        ctx.stroke();
      });
      ctx.shadowBlur = 0;
    }

    function stepNodes(dt) {
      const speed = 0.55 + intensity * 0.7;
      nodes.forEach((n) => {
        n.x += n.vx * dt * speed;
        n.y += n.vy * dt * speed;
        if (n.x < 0) n.x = width;
        if (n.x > width) n.x = 0;
        if (n.y < 0) n.y = height;
        if (n.y > height) n.y = 0;
      });
    }

    function drawNodes() {
      const maxDist = cfg.linkDistance || 130;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDist) {
            const op = (1 - dist / maxDist) * (0.1 + intensity * 0.35);
            ctx.strokeStyle = cfg.lineColor(op);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      nodes.forEach((n) => {
        ctx.beginPath();
        ctx.fillStyle = cfg.nodeColor(0.35 + intensity * 0.55);
        ctx.arc(n.x, n.y, n.r + intensity * 0.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function frame(now) {
      const dt = Math.min(now - last, 48);
      last = now;
      intensity += (targetIntensity - intensity) * 0.06;
      ctx.clearRect(0, 0, width, height);
      if (cfg.grid) drawGrid();
      if (cfg.ticker) {
        stepTicker(dt);
        drawTicker();
      }
      stepNodes(dt);
      drawNodes();
      rafId = requestAnimationFrame(frame);
    }

    resize();
    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(resize, 150);
    });

    if (!reduced) {
      last = performance.now();
      rafId = requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, width, height);
      if (cfg.grid) drawGrid();
      drawNodes();
    }

    return {
      setIntensity(v) { targetIntensity = v; },
      stop() { if (rafId) cancelAnimationFrame(rafId); }
    };
  }

  const quantCanvas = document.getElementById('canvas-quant');
  const roboticsCanvas = document.getElementById('canvas-robotics');

  const quantField = quantCanvas ? createFieldCanvas(quantCanvas, {
    grid: true,
    ticker: true,
    tickerLines: 3,
    linkDistance: 125,
    gridColor: 'rgba(62, 207, 142, 0.05)',
    glow: 'rgba(62, 207, 142, 0.55)',
    tickerColor: (li, i) => `rgba(62, 207, 142, ${0.32 + li * 0.07 + i * 0.25})`,
    lineColor: (op) => `rgba(62, 207, 142, ${op})`,
    nodeColor: (op) => `rgba(185, 245, 220, ${op})`
  }) : null;

  const roboticsField = roboticsCanvas ? createFieldCanvas(roboticsCanvas, {
    grid: false,
    ticker: false,
    linkDistance: 150,
    gridColor: 'rgba(0, 238, 255, 0.05)',
    glow: 'rgba(0, 238, 255, 0.55)',
    tickerColor: () => 'rgba(0, 238, 255, 0.4)',
    lineColor: (op) => `rgba(0, 238, 255, ${op})`,
    nodeColor: (op) => `rgba(170, 240, 255, ${op})`
  }) : null;

  /* ---------- Panel hover / focus / click choreography ---------- */
  const panelEls = {
    quant: document.getElementById('panel-quant'),
    robotics: document.getElementById('panel-robotics')
  };
  const fields = { quant: quantField, robotics: roboticsField };
  let navigating = false;

  function setHover(activeKey, isHover) {
    if (!canHover || reduced || navigating) return;
    Object.keys(panelEls).forEach((key) => {
      const isActive = key === activeKey;
      gsap.to(panelEls[key], {
        flexGrow: isHover ? (isActive ? 1.32 : 0.68) : 1,
        duration: 0.7,
        ease: 'power3.out'
      });
      if (fields[key]) fields[key].setIntensity(isHover && isActive ? 1 : 0);
    });
  }

  Object.keys(panelEls).forEach((key) => {
    const el = panelEls[key];
    if (!el) return;

    el.addEventListener('mouseenter', () => setHover(key, true));
    el.addEventListener('mouseleave', () => setHover(key, false));
    el.addEventListener('focus', () => setHover(key, true));
    el.addEventListener('blur', () => setHover(key, false));

    el.addEventListener('click', (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (navigating) {
        e.preventDefault();
        return;
      }
      const href = el.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      navigating = true;

      if (reduced) {
        window.location.href = href;
        return;
      }

      const otherKey = key === 'quant' ? 'robotics' : 'quant';
      const otherEl = panelEls[otherKey];

      if (fields[key]) fields[key].setIntensity(1);
      gsap.to('.divider', { opacity: 0, duration: 0.3, ease: 'power1.in' });
      if (otherEl) {
        gsap.to(otherEl, { flexGrow: 0.001, opacity: 0, duration: 0.45, ease: 'power2.in' });
      }
      gsap.to(el, {
        flexGrow: 6,
        duration: 0.55,
        ease: 'power3.inOut',
        onComplete: () => { window.location.href = href; }
      });
    });
  });

  /* ---------- Page-load entrance ---------- */
  if (!reduced && window.gsap) {
    gsap.timeline({ defaults: { ease: 'power3.out' } })
      .from('.panel-content', { opacity: 0, y: 22, duration: 0.9, stagger: 0.15 })
      .from('.divider-badge', { opacity: 0, scale: 0.6, duration: 0.6, ease: 'back.out(2)' }, 0.15)
      .from('.masthead', { opacity: 0, y: -10, duration: 0.6 }, 0.1);
  }
});
</script>
</body>
</html>
